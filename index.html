
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NC // ELEMENT SCANNER</title>

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            background:
                radial-gradient(ellipse at 15% 20%, #79234c55, transparent 40%),
                radial-gradient(ellipse at 85% 75%, #008ca855, transparent 40%),
                linear-gradient(135deg, #080910, #151323 55%, #090b14);
            overflow-x: hidden;
        }

        /* Background grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(#00e1ff0a 1px, transparent 1px),
                linear-gradient(90deg, #00e1ff0a 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, black, transparent);
        }

        /* Scanline effect */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                transparent 0px,
                transparent 3px,
                #ffffff05 4px
            );
            opacity: 0.35;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 35px;
            position: relative;
            z-index: 1;
            background: linear-gradient(
                145deg,
                #1b1b2ceF,
                #10121feF
            );
            border: 1px solid #00e1ff88;
            border-top: 3px solid #ffe600;
            box-shadow:
                0 0 25px #00e1ff18,
                0 0 55px #ff2b7515,
                8px 8px 0 #ff2b7544;
            clip-path: polygon(
                0 0,
                96% 0,
                100% 4%,
                100% 100%,
                4% 100%,
                0 96%
            );
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .top-label {
            color: #00e1ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00e1ff;
        }

        .status {
            color: #ffe600;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            letter-spacing: 1px;
            border: 1px solid #ffe60088;
            padding: 6px 9px;
            box-shadow: 0 0 8px #ffe60022;
        }

        h1 {
            margin: 0;
            color: #ffe600;
            font-family: 'Orbitron', sans-serif;
            font-size: 30px;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: -1px;
            text-shadow:
                3px 3px 0 #ff2b75,
                0 0 18px #ffe60033;
        }

        .subtitle {
            color: #aab1ca;
            font-size: 16px;
            letter-spacing: 2px;
            margin: 12px 0 25px;
        }

        .accent-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(
                90deg,
                #ffe600,
                #ff2b75,
                #c18aff,
                #00e1ff,
                transparent
            );
            box-shadow: 0 0 12px #00e1ff55;
            margin-bottom: 30px;
        }

        .section-label {
            color: #00e1ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #080b16cc;
            border: 1px solid #525775;
            border-left: 4px solid #c18aff;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 19px;
            outline: none;
            margin-bottom: 18px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #00e1ff;
            box-shadow: 0 0 15px #00e1ff33;
        }

        input::placeholder {
            color: #737b98;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            background: #ffe600;
            color: #101018;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 4px 4px 0 #ff2b75;
        }

        button:hover {
            background: #ff2b75;
            color: #ffffff;
            box-shadow:
                0 0 18px #ff2b7588,
                4px 4px 0 #00e1ff;
            transform: translate(-2px, -2px);
        }

        .results-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 35px 0 14px;
        }

        h2 {
            color: #c18aff;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 10px #c18aff55;
        }

        .result-tag {
            color: #ff2b75;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            letter-spacing: 1px;
        }

        .results {
            padding: 20px;
            background: #080b16cc;
            border: 1px solid #444966;
            border-top: 2px solid #00e1ff;
            box-shadow: inset 0 0 20px #00e1ff0b;
        }

        .results p {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            color: #aab1ca;
            font-size: 18px;
            margin: 0;
            padding: 13px 0;
            border-bottom: 1px solid #30344a;
        }

        .results p:last-child {
            border-bottom: none;
        }

        .results span {
            color: #00e1ff;
            font-weight: 700;
            text-align: right;
            text-shadow: 0 0 8px #00e1ff55;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 28px;
            padding-top: 15px;
            border-top: 1px solid #ffffff18;
            color: #737b98;
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            letter-spacing: 1px;
        }

        .footer span:last-child {
            color: #ffe600;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }

            .top-label {
                font-size: 8px;
            }

            .results p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top-bar">
            <div class="top-label">NIGHT CITY // NET DATABASE</div>
            <div class="status">● SYSTEM ONLINE</div>
        </div>

        <h1>NON-METAL<br>ELEMENT SCANNER</h1>

        <p class="subtitle">IDENTIFICATION SYSTEM // NC-2077</p>

        <div class="accent-line"></div>

        <div class="section-label">01 // ELEMENT INPUT</div>

        <input type="text" id="nonmetal1" placeholder="Enter a non-metal element symbol...">

        <button py-click="search_element">INITIATE SCAN ↗</button>

        <div class="results-heading">
            <h2>SCAN RESULTS</h2>
            <div class="result-tag">02 // DATA OUTPUT</div>
        </div>

        <div class="results">
            <p>SYMBOL <span id="symbol">-</span></p>
            <p>ELEMENT NAME <span id="name">-</span></p>
            <p>ATOMIC NUMBER <span id="atomic_number">-</span></p>
            <p>ATOMIC MASS <span id="atomic_mass">-</span></p>
        </div>

        <div class="footer">
            <span>NIGHT CITY DATABASE</span>
            <span>ACCESS GRANTED // 2077</span>
        </div>

    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
