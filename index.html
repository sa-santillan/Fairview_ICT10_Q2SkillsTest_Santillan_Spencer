<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NC-NET // ELEMENT FINDER</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Cyberpunk Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- PyScript CSS & JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        :root {
            --edgerunner-yellow: #fcee0a;
            --edgerunner-cyan: #00f0ff;
            --edgerunner-pink: #ff0055;
            --cyber-dark: #0d0e15;
            --panel-bg: #161822;
        }

        body {
            background-color: var(--cyber-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 60%),
                linear-gradient(rgba(252, 238, 10, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(252, 238, 10, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .cyber-card {
            background: var(--panel-bg);
            border: 2px solid var(--edgerunner-yellow);
            clip-path: polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 25px 100%, 0 calc(100% - 25px));
            padding: 2.5rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 0 25px rgba(252, 238, 10, 0.15);
            position: relative;
        }

        .cyber-title {
            color: var(--edgerunner-yellow);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px var(--edgerunner-pink);
        }

        .cyber-subtitle {
            color: var(--edgerunner-cyan);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
        }

        .cyber-input {
            background-color: #08090d;
            border: 1px solid var(--edgerunner-cyan);
            color: var(--edgerunner-yellow);
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 2px;
            border-radius: 0;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
        }

        .cyber-input:focus {
            background-color: #08090d;
            color: var(--edgerunner-yellow);
            border-color: var(--edgerunner-yellow);
            box-shadow: 0 0 10px rgba(252, 238, 10, 0.5);
        }

        .btn-cyber {
            background-color: var(--edgerunner-yellow);
            color: #000000;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            border-radius: 0;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            transition: all 0.2s ease-in-out;
        }

        .btn-cyber:hover {
            background-color: var(--edgerunner-cyan);
            color: #000000;
            box-shadow: 0 0 15px var(--edgerunner-cyan);
        }

        .result-hud {
            background: rgba(8, 9, 13, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-left: 4px solid var(--edgerunner-pink);
            padding: 1.25rem;
        }

        .hud-label {
            color: var(--edgerunner-cyan);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .case-tag {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--edgerunner-cyan);
            color: var(--edgerunner-cyan);
            padding: 2px 8px;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .symbol-active {
            color: var(--edgerunner-yellow) !important;
            font-size: 1.4rem;
            text-shadow: 0 0 8px rgba(252, 238, 10, 0.6);
        }

        .status-tag {
            font-size: 0.75rem;
            background: var(--edgerunner-pink);
            color: #fff;
            padding: 2px 6px;
            font-weight: 700;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="cyber-card">
            <!-- Header section -->
            <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="cyber-subtitle">// NC-DATABASE v2.077</span>
                <span class="status-tag">ONLINE</span>
            </div>
            <h1 class="h2 cyber-title mb-1">ELEMENT FINDER</h1>
            <p class="text-muted small mb-4">INPUT CHEMICAL SYMBOL TO SCAN DATABASE...</p>

            <!-- Form -->
            <div class="mb-3">
                <label for="nonmetal1" class="form-label hud-label small">SYS_INPUT_STRING:</label>
                <input type="text" class="form-control cyber-input" id="nonmetal1" placeholder="Type here..." py-input="check_casing">
            </div>

            <button class="btn btn-cyber w-100 py-2 mb-4" py-click="search_element">EXECUTE SCAN</button>

            <!-- Results HUD -->
            <div class="result-hud">
                <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom border-secondary">
                    <span class="hud-label small">// SCAN RESULTS</span>
                    <span id="case_status" class="case-tag">CASE: UNKNOWN</span>
                </div>

                <div class="d-flex justify-content-between py-1 border-bottom border-dark">
                    <span class="hud-label">Symbol:</span>
                    <span id="symbol" class="hud-value symbol-active">-</span>
                </div>
                <div class="d-flex justify-content-between py-1 border-bottom border-dark">
                    <span class="hud-label">Element Name:</span>
                    <span id="name" class="hud-value">-</span>
                </div>
                <div class="d-flex justify-content-between py-1 border-bottom border-dark">
                    <span class="hud-label">Atomic Number:</span>
                    <span id="atomic_number" class="hud-value">-</span>
                </div>
                <div class="d-flex justify-content-between py-1">
                    <span class="hud-label">Atomic Mass:</span>
                    <span id="atomic_mass" class="hud-value">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Python Script -->
    <script type="py" src="main.py" config='{"packages": ["pyscript"]}'></script>
</body>
</html>
