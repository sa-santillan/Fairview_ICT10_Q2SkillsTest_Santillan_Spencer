<body>
    <div class="container">
    <h1>Periodic Table Information Finder</h1>
    <p>Enter an Element to search</p>

    <input type="text" id="planet1" placeholder="Example: EARTH">

    <br>
    <button py-click="search_element">Search Element</button>
    <div class="result">
        <h3>Search Results</h3>
<!-- Code, Name, Order, Moons-->
        <p><b>Element Symbol:</b> <span id="code">-</span></p>
        <p><b>Element Name:</b> <span id="name">-</span></p>
        <p><b>Atomic Number:</b> <span id="order">-</span></p>
        <p><b>Atomic Mass:</b> <span id="moons">-</span></p>
        <span></span>

        </div>
<!--Connect Python File-->
<script type="py" src="main.py"></script>
</div>
